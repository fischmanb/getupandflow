<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Up and Flow</title>
    <!-- Google tag. Ids are injected at build time (VITE_GA_MEASUREMENT_ID,
         VITE_GOOGLE_ADS_ID); with neither set the tag is inert. `linker`
         carries the click id across www.getupandflow.co -> app.getupandflow.co
         so a purchase attributes to the ad that produced it. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;
      (function () {
        var ga = "%VITE_GA_MEASUREMENT_ID%";
        var aw = "%VITE_GOOGLE_ADS_ID%";
        var ids = [ga, aw].filter(function (id) { return id && id.indexOf("%") !== 0; });
        if (!ids.length) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + ids[0];
        document.head.appendChild(s);
        gtag("js", new Date());
        var linker = { domains: ["getupandflow.co", "www.getupandflow.co", "app.getupandflow.co"] };
        ids.forEach(function (id) { gtag("config", id, { linker: linker }); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
